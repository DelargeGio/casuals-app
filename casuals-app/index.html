<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASUALS // PRIVATE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-messaging-compat.js"></script>
    
    <link rel="stylesheet" href="style.css?v=neon_definitivo_22">
</head>
<body class="vista-feed">

    <div id="login-screen" class="login-body">
        <img src="img/banner.png" alt="CASUALS" style="max-width: 100%; height: auto; margin-bottom: 15px;">
        <h1 class="titulo-industrial">CASUALS</h1>
        <div id="pin-display">
            <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
        </div>
        <div class="teclado-grid" id="teclado-login">
            <button class="btn-rudo" data-digito="1">1</button>
            <button class="btn-rudo" data-digito="2">2</button>
            <button class="btn-rudo" data-digito="3">3</button>
            <button class="btn-rudo" data-digito="4">4</button>
            <button class="btn-rudo" data-digito="5">5</button>
            <button class="btn-rudo" data-digito="6">6</button>
            <button class="btn-rudo" data-digito="7">7</button>
            <button class="btn-rudo" data-digito="8">8</button>
            <button class="btn-rudo" data-digito="9">9</button>
            <button class="btn-rudo" data-digito="C">C</button>
            <button class="btn-rudo" data-digito="0">0</button>
            <button class="btn-rudo" id="btn-ok-pin">OK</button>
        </div>
        <div style="text-align: center; margin-top: 15px; font-family: monospace; font-size: 0.75rem; color: #666;">CASUALS v2.0</div>
        <div id="error-pin-box" style="display:none; color: var(--fuego); margin-top: 15px; font-weight: bold; text-align: center;">PIN INCORRECTO</div>
    </div>

    <div id="app-screen" class="app-screen" style="display: none;">
        
        <div id="encabezado-chat-container" style="width: 100%; flex-shrink: 0;">
            <button class="panic-btn" id="btn-panic-acab">🔥 A.C.A.B. 1.3.1.2 🚓</button>
            <div id="usuarios-conectados-bar" style="background: #050505; border-bottom: 1px solid var(--neon-azul); padding: 6px 12px; font-size: 0.75rem; color: var(--neon-azul); text-shadow: 0 0 8px var(--neon-azul); display: flex; align-items: center; gap: 8px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch;">
                <span style="font-weight: bold; color: var(--oro); text-shadow: 0 0 8px var(--oro);">🟢 CONECTADOS:</span>
                <span id="lista-nombres-conectados">Cargando presencia...</span>
            </div>
        </div>

        <div id="view-content" class="content-area">
            <div id="feed-container">
                <div id="feed-filtros"></div>
                <div id="feed-posts-lista"></div>
            </div>
            
            <div id="mensajes-container">
                <div id="mensajes-lista"></div>
                
                <div class="chat-input-container">
                    <input type="text" id="chat-in" placeholder="Escribe un mensaje...">
                    <button class="send-btn" id="btn-enviar-msg" onclick="enviarMensajeSeguro()">➤</button>
                    <button id="btn-bengala-humo" class="smoke-btn">💨</button>
                    
                    <div style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; cursor: pointer;" title="Tomar Foto">
                        <span style="font-size: 1.2rem; pointer-events: none;">📸</span>
                        <input type="file" id="input-foto-cam" accept="image/jpeg" capture="environment" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5;">
                    </div>

                    <div style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; cursor: pointer;" title="Subir desde Galería">
                        <span style="font-size: 1.2rem; pointer-events: none;">📁</span>
                        <input type="file" id="input-foto-galeria" accept="image/*,video/*" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5;">
                    </div>
                </div>
            </div>
        </div>

        <nav class="nav-bar">
            <button class="nav-btn active" id="nav-feed" onclick="window.cambiarVistaApp('feed')" style="touch-action: manipulation; cursor: pointer;">📰 FEED</button>
            <button class="nav-btn" id="nav-chat" onclick="window.cambiarVistaApp('chat')" style="touch-action: manipulation; cursor: pointer;">💬 CHAT</button>
            <button class="nav-btn" id="nav-salir" onclick="if(typeof cerrarSesion==='function')cerrarSesion();else localStorage.clear();window.location.reload();" style="color: var(--fuego); border-color: var(--fuego); touch-action: manipulation; cursor: pointer;">❌ SALIR</button>
        </nav>

    </div>

    <div id="visor-imagen-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;">
        <button onclick="cerrarVisorImagen()" style="position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--fuego, #ff3366); font-size: 2rem; cursor: pointer; z-index: 10000;">✖</button>
        <img id="visor-imagen-src" src="" style="max-width: 95%; max-height: 85%; object-fit: contain; border-radius: 8px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);">
        <a id="visor-imagen-descargar" href="" download="casuals_media.jpg" style="margin-top: 20px; padding: 10px 20px; background: var(--neon-azul, #00f3ff); color: #000; font-weight: bold; text-decoration: none; border-radius: 4px;">💾 Guardar Imagen</a>
    </div>

    <script>
        window.CASUALS = window.CASUALS || {};
        
        const firebaseConfig = {
            apiKey: "AIzaSyAxvm2p6CzSOXJlR5m1JX-jWKkf_0S6oPc",
            authDomain: "casuals-8-32a4d.firebaseapp.com",
            databaseURL: "https://casuals-8-32a4d-default-rtdb.firebaseio.com/",
            projectId: "casuals-8-32a4d",
            storageBucket: "casuals-8-32a4d.firebasestorage.app",
            messagingSenderId: "552015693448",
            appId: "1:552015693448:web:e3cdb8df21007b5a27c13d"
        };

        window.CASUALS.authReady = false;
        window.CASUALS.authCallbacks = [];
        
        window.CASUALS.whenAuthReady = function(cb) {
            if (window.CASUALS.authReady) {
                cb();
            } else {
                window.CASUALS.authCallbacks.push(cb);
            }
        };

        const liberarBloqueoAuth = () => {
            if (!window.CASUALS.authReady) {
                window.CASUALS.authReady = true;
                window.CASUALS.authCallbacks.forEach(cb => {
                    try { cb(); } catch (e) { console.error("Error en callback:", e); }
                });
                window.CASUALS.authCallbacks = [];
            }
        };
        setTimeout(liberarBloqueoAuth, 2000);

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            window.CASUALS.db = firebase.database();
            window.db = window.CASUALS.db;
            window.CASUALS.firebaseInitialized = true;

            firebase.auth().onAuthStateChanged((user) => {
                window.CASUALS.authReady = true;
                window.CASUALS.authCallbacks.forEach(cb => {
                    try { cb(); } catch (e) { console.error("Error en callback de auth:", e); }
                });
                window.CASUALS.authCallbacks = [];
            });

            firebase.auth().signInAnonymously().catch((err) => {
                console.warn("⚠️ Advertencia de Auth Anónima:", err);
                liberarBloqueoAuth();
            });
        } catch (e) {
            console.error("Error crítico al iniciar Firebase:", e);
            liberarBloqueoAuth();
        }

        // CONTROLADOR DE VISTAS (FEED / CHAT)
        window.cambiarVistaApp = function(vista) {
            const body = document.body;
            const btnFeed = document.getElementById('nav-feed');
            const btnChat = document.getElementById('nav-chat');

            if (vista === 'feed') {
                body.classList.remove('vista-chat');
                body.classList.add('vista-feed');
                if (btnFeed) btnFeed.classList.add('active');
                if (btnChat) btnChat.classList.remove('active');
                if (typeof window.cargarPostsFeed === 'function') window.cargarPostsFeed();
            } else {
                body.classList.remove('vista-feed');
                body.classList.add('vista-chat');
                if (btnChat) btnChat.classList.add('active');
                if (btnFeed) btnFeed.classList.remove('active');
                if (typeof window.cargarMensajes === 'function') window.cargarMensajes();
            }
        };

        // VISOR DE IMAGEN
        window.abrirVisorImagen = function(url) {
            const modal = document.getElementById('visor-imagen-modal');
            const img = document.getElementById('visor-imagen-src');
            const btnDescarga = document.getElementById('visor-imagen-descargar');
            if(modal && img) {
                img.src = url;
                btnDescarga.href = url;
                modal.style.display = 'flex';
            }
        };
        window.cerrarVisorImagen = function() {
            const modal = document.getElementById('visor-imagen-modal');
            const img = document.getElementById('visor-imagen-src');
            if(modal) {
                modal.style.display = 'none';
                img.src = '';
            }
        };
    </script>
    
    <script>
        if (window.location.search.includes('debug=true')) {
            const erudaScript = document.createElement('script');
            erudaScript.src = "https://cdn.jsdelivr.net/npm/eruda";
            erudaScript.onload = () => eruda.init();
            document.head.appendChild(erudaScript);
        }
    </script>

    <script src="feeds.js?v=22"></script>
    <script src="panic.js?v=22"></script>
    <script src="push-notifications.js?v=22" onerror="console.warn('Advertencia: push-notifications opcional omitido');"></script>
    <script src="script.js?v=22"></script>
    <script src="chat.js?v=22"></script>
    <script src="login.js?v=22"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('casuals_autenticado') === 'true') {
                const loginScreen = document.getElementById('login-screen');
                const appScreen = document.getElementById('app-screen');
                if (loginScreen) loginScreen.style.display = 'none';
                if (appScreen) appScreen.style.display = 'flex';
            }
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    reg.update();
                }).catch(err => console.log("SW error:", err));
            });
        }
    </script>
</body>
</html>
