<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASUALS // PRIVATE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-messaging-compat.js"></script>
    
    <link rel="stylesheet" href="style.css?v=neon_definitivo_17">
</head>
<body class="vista-feed">

    <div id="login-screen" class="login-body">
        <img src="img/banner.png" alt="Casuals Banner" class="banner-integrado" onerror="this.style.display='none'">
        <h1 class="titulo-industrial">CASUALS</h1>
        <div id="pin-display">
            <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
        </div>
        <div class="teclado-grid" id="teclado-login">
            <button class="btn-rudo" data-digito="1">1</button>
            <button class="btn-rudo" data-digito="2">2</button>
            <button class="btn-rudo" data-digito="3">3</button>
            <button class="btn-rudo" data-digito="4">4</button>
            <button class="btn-rudo" data-digito="5">5</button>
            <button class="btn-rudo" data-digito="6">6</button>
            <button class="btn-rudo" data-digito="7">7</button>
            <button class="btn-rudo" data-digito="8">8</button>
            <button class="btn-rudo" data-digito="9">9</button>
            <button class="btn-rudo" data-digito="C">C</button>
            <button class="btn-rudo" data-digito="0">0</button>
            <button class="btn-rudo" id="btn-ok-pin">OK</button>
        </div>
        <div style="text-align: center; margin-top: 15px; font-family: monospace; font-size: 0.75rem; color: #666;">CASUALS v2.0</div>
        <div id="error-pin-box" style="display:none; color: var(--fuego); margin-top: 15px; font-weight: bold; text-align: center;">PIN INCORRECTO</div>
    </div>

    <div id="app-screen" class="app-screen" style="display: none;">
        
        <div id="encabezado-chat-container" style="width: 100%; flex-shrink: 0;">
            <button class="panic-btn" id="btn-panic-acab">🔥 A.C.A.B. 1.3.1.2 🚓</button>
            <div id="usuarios-conectados-bar" style="background: #050505; border-bottom: 1px solid var(--neon-azul); padding: 6px 12px; font-size: 0.75rem; color: var(--neon-azul); text-shadow: 0 0 8px var(--neon-azul); display: flex; align-items: center; gap: 8px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch;">
                <span style="font-weight: bold; color: var(--oro); text-shadow: 0 0 8px var(--oro);">🟢 CONECTADOS:</span>
                <span id="lista-nombres-conectados">Cargando presencia...</span>
            </div>
        </div>

        <div id="view-content" class="content-area">
            <div id="feed-container" style="height: 100%;"></div>
            
            <div id="mensajes-container">
                <div id="mensajes-lista"></div>
                
                <div class="chat-input-container">
                    <input type="text" id="chat-in" placeholder="Escribe un mensaje...">
                    <button class="send-btn" id="btn-enviar-msg">➤</button>
                    <button id="btn-bengala-humo" class="smoke-btn">💨</button>
                    
                    <div id="btn-trigger-camara" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; cursor: pointer;" title="Tomar Foto">
                        <span style="font-size: 1.2rem; pointer-events: none;">📸</span>
                        <input type="file" id="input-foto-cam" accept="image/*" style="display: none;">
                    </div>

                    <div style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; cursor: pointer;" title="Subir desde Galería">
                        <span style="font-size: 1.2rem; pointer-events: none;">📁</span>
                        <input type="file" id="input-foto-galeria" accept="image/*,video/*" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5;">
                    </div>
                </div>
            </div>
        </div>

        <nav class="nav-bar">
            <button class="nav-btn active" id="nav-feed" style="touch-action: manipulation; cursor: pointer;">📰 FEED</button>
            <button class="nav-btn" id="nav-chat" style="touch-action: manipulation; cursor: pointer;">💬 CHAT</button>
            <button class="nav-btn" id="nav-salir" onclick="if(typeof cerrarSesion==='function')cerrarSesion();else localStorage.clear();window.location.reload();" style="color: var(--fuego); border-color: var(--fuego); touch-action: manipulation; cursor: pointer;">❌ SALIR</button>
        </nav>

    </div>

    <div id="modal-camara-hardware" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 99999; flex-direction: column; align-items: center; justify-content: center;">
        <video id="video-camara-preview" autoplay playsinline style="width: 100%; height: 80vh; object-fit: cover;"></video>
        <div style="height: 20vh; display: flex; align-items: center; justify-content: center; gap: 30px; width: 100%; background: #111;">
            <button id="btn-capturar-hard" style="width: 65px; height: 65px; border-radius: 50%; background: #fff; border: 4px solid var(--oro); cursor: pointer; outline: none; box-shadow: 0 0 15px var(--oro);"></button>
            <button id="btn-cerrar-hard" style="padding: 10px 20px; background: var(--fuego); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: monospace;">CANCELAR</button>
        </div>
        <canvas id="canvas-camara-temp" style="display: none;"></canvas>
    </div>

    <script>
        window.CASUALS = window.CASUALS || {};
        
        const firebaseConfig = {
            apiKey: "AIzaSyAxvm2p6CzSOXJlR5m1JX-jWKkf_0S6oPc",
            authDomain: "casuals-8-32a4d.firebaseapp.com",
            databaseURL: "https://casuals-8-32a4d-default-rtdb.firebaseio.com/",
            projectId: "casuals-8-32a4d",
            storageBucket: "casuals-8-32a4d.firebasestorage.app",
            messagingSenderId: "552015693448",
            appId: "1:552015693448:web:e3cdb8df21007b5a27c13d"
        };

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            window.CASUALS.db = firebase.database();
            window.db = window.CASUALS.db; 
        } catch (e) {
            console.error("Error crítico al iniciar Firebase:", e);
        }
    </script>
    
    <script>
        let streamCamaraActivo = null;

        document.getElementById('btn-trigger-camara').addEventListener('click', async () => {
            const modal = document.getElementById('modal-camara-hardware');
            const video = document.getElementById('video-camara-preview');
            modal.style.display = 'flex';

            try {
                streamCamaraActivo = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = streamCamaraActivo;
            } catch (err) {
                alert("No se pudo acceder a la cámara: " + err.message);
                modal.style.display = 'none';
            }
        });

        document.getElementById('btn-cerrar-hard').addEventListener('click', () => {
            cerrarCamaraHardware();
        });

        function cerrarCamaraHardware() {
            const modal = document.getElementById('modal-camara-hardware');
            modal.style.display = 'none';
            if (streamCamaraActivo) {
                streamCamaraActivo.getTracks().forEach(track => track.stop());
                streamCamaraActivo = null;
            }
        }

        document.getElementById('btn-capturar-hard').addEventListener('click', () => {
            const video = document.getElementById('video-camara-preview');
            const canvas = document.getElementById('canvas-camara-temp');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const archivo = new File([blob], "captura_camara.jpg", { type: "image/jpeg" });
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(archivo);
                
                const inputCam = document.getElementById('input-foto-cam');
                inputCam.files = dataTransfer.files;
                
                // Dispara el evento change para que tu chat.js procese y envíe la foto automáticamente
                inputCam.dispatchEvent(new Event('change', { bubbles: true }));
                
                cerrarCamaraHardware();
            }, 'image/jpeg', 0.85);
        });
    </script>

    <script>
        if (window.location.search.includes('debug=true')) {
            const erudaScript = document.createElement('script');
            erudaScript.src = "https://cdn.jsdelivr.net/npm/eruda";
            erudaScript.onload = () => eruda.init();
            document.head.appendChild(erudaScript);
        }
    </script>

    <script src="login.js?v=17"></script>
    <script src="multimedia.js?v=17"></script>
    <script src="feeds.js?v=17"></script>
    <script src="panic.js?v=17"></script>
    <script src="push-notifications.js?v=17"></script>
    <script src="script.js?v=17"></script>
    <script src="chat.js?v=17"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    reg.update();
                }).catch(err => console.log("SW error:", err));
            });
        }
    </script>
</body>
</html>
