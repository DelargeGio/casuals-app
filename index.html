<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASUALS // PRIVATE</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="login-screen" class="screen-container" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;">
        <div class="logo-box">
            <h2>CASUALS</h2>
        </div>
        
        <div id="pin-display" style="display: flex; gap: 10px; margin: 20px 0;">
            <div class="pin-dot" style="width: 15px; height: 15px; border: 2px solid #0ff; border-radius: 50%;"></div>
            <div class="pin-dot" style="width: 15px; height: 15px; border: 2px solid #0ff; border-radius: 50%;"></div>
            <div class="pin-dot" style="width: 15px; height: 15px; border: 2px solid #0ff; border-radius: 50%;"></div>
            <div class="pin-dot" style="width: 15px; height: 15px; border: 2px solid #0ff; border-radius: 50%;"></div>
        </div>

        <div id="error-pin-box" style="display: none; color: #ff0055; margin-bottom: 10px; font-weight: bold;">PIN incorrecto</div>

        <div class="teclado-numerico" style="display: grid; grid-template-columns: repeat(3, 70px); gap: 15px;">
            <button onclick="anadirDigito(1)">1</button>
            <button onclick="anadirDigito(2)">2</button>
            <button onclick="anadirDigito(3)">3</button>
            <button onclick="anadirDigito(4)">4</button>
            <button onclick="anadirDigito(5)">5</button>
            <button onclick="anadirDigito(6)">6</button>
            <button onclick="anadirDigito(7)">7</button>
            <button onclick="anadirDigito(8)">8</button>
            <button onclick="anadirDigito(9)">9</button>
            <button onclick="anadirDigito('C')">C</button>
            <button onclick="anadirDigito(0)">0</button>
            <button onclick="verificarPinManual()">OK</button>
        </div>
    </div>

    <div id="app-screen" style="display: none; flex-direction: column; height: 100vh;">
        <div id="barra-conectados" style="padding: 8px; background: #111; border-bottom: 1px solid #333;">
            <span id="lista-nombres-conectados" style="color: #0f0; font-size: 14px;">Cargando presencia...</span>
        </div>

        <div id="view-feed" class="view-section" style="display: flex; flex-direction: column; flex: 1; overflow-y: auto;">
            <div style="padding: 10px; background: #1a1a1a;">
                <input type="text" id="chat-in" placeholder="Escribe algo..." style="width: 70%; padding: 8px;" />
                <button onclick="enviarMensaje()" style="padding: 8px 12px;">Publicar</button>
            </div>
            <div id="mensajes-lista" style="flex: 1; overflow-y: auto; padding: 10px;"></div>
        </div>

        <div id="view-chat" class="view-section" style="display: none; flex-direction: column; flex: 1; overflow-y: auto;">
            <div style="padding: 10px; color: #fff;">Canal de Chat directo</div>
        </div>

        <div class="nav-inferior" style="display: flex; justify-content: space-around; background: #111; padding: 12px; border-top: 1px solid #333;">
            <button onclick="cambiarVista('feed')">FEED</button>
            <button onclick="cambiarVista('chat')">CHAT</button>
            <button onclick="cerrarSesion()">SALIR ❌</button>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script src="chat.js"></script>
    <script src="login.js"></script>
</body>
</html>
