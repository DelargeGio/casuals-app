<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CASUALS // PRIVATE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- 1. CDN DE FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAxvm2p6CzSOXJlR5m1JX-jWKkf_0S6oPc",
            authDomain: "casuals-8-32a4d.firebaseapp.com",
            databaseURL: "https://casuals-8-32a4d-default-rtdb.firebaseio.com/",
            projectId: "casuals-8-32a4d",
            storageBucket: "casuals-8-32a4d.appspot.com",

        }

    <!-- ESTILOS -->
    <link rel="stylesheet" href="style.css?v=neon_definitivo_4">
</head>
<body>

    <div id="login-screen" class="login-body">
        <img src="img/banner.png" alt="Casuals Banner" class="banner-integrado" onerror="this.style.display='none'">
        <h1 class="titulo-industrial">CASUALS</h1>
        <div id="pin-display">
            <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
        </div>
        <div class="teclado-grid">
            <button class="btn-rudo" onclick="anadirDigito('1')">1</button>
            <button class="btn-rudo" onclick="anadirDigito('2')">2</button>
            <button class="btn-rudo" onclick="anadirDigito('3')">3</button>
            <button class="btn-rudo" onclick="anadirDigito('4')">4</button>
            <button class="btn-rudo" onclick="anadirDigito('5')">5</button>
            <button class="btn-rudo" onclick="anadirDigito('6')">6</button>
            <button class="btn-rudo" onclick="anadirDigito('7')">7</button>
            <button class="btn-rudo" onclick="anadirDigito('8')">8</button>
            <button class="btn-rudo" onclick="anadirDigito('9')">9</button>
            <button class="btn-rudo" onclick="anadirDigito('C')">C</button>
            <button class="btn-rudo" onclick="anadirDigito('0')">0</button>
            <button class="btn-rudo" onclick="verificarPinManual()">OK</button>
        </div>
        <div style="text-align: center; margin-top: 15px; font-family: monospace; font-size: 0.75rem; color: #666;">CASUALS v2.0</div>
        <div id="error-pin-box" style="display:none; color: var(--fuego); margin-top: 15px; font-weight: bold; text-align: center;">PIN INCORRECTO</div>
    </div>

    <div id="app-screen" class="app-screen" style="display: none;">
        
        <div id="encabezado-chat-container" style="width: 100%; flex-shrink: 0;">
            <button class="panic-btn" onclick="activarAlertaACAB()">🔥 A.C.A.B. 1.3.1.2 🚓</button>
            <div id="usuarios-conectados-bar" style="background: #050505; border-bottom: 1px solid var(--neon-azul); padding: 6px 12px; font-size: 0.75rem; color: var(--neon-azul); display: flex; align-items: center; gap: 8px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch;">
                <span style="font-weight: bold; color: var(--oro);">🟢 CONECTADOS:</span>
                <span id="lista-nombres-conectados">Cargando presencia...</span>
            </div>
        </div>

        <div id="view-content" class="content-area">
            <div id="feed-container" style="display: none; height: 100%;"></div>
            
            <div id="mensajes-container" style="display: none;">
                <div id="mensajes-lista"></div>
                
                <div class="chat-input-container">
                    <input type="text" id="chat-in" placeholder="Escribe un mensaje..." onkeydown="if(event.key === 'Enter') enviarMensaje();">
                    <button class="send-btn" onclick="enviarMensaje()">➤</button>
                    <button id="btn-bengala-humo" class="smoke-btn" onclick="activarBengalaYHumio()">💨</button>
                    <label class="image-btn" style="cursor: pointer;">
                        📷<input type="file" accept="image/*,video/*" onchange="typeof enviarArchivoLocal === 'function' ? enviarArchivoLocal(event) : console.log('Sube archivo')" style="display: none;">
                    </label>
                </div>
            </div>
        </div>

        <nav class="nav-bar">
            <button class="nav-btn active" id="nav-feed" onclick="renderView('feed')">📰 FEED</button>
            <button class="nav-btn" id="nav-chat" onclick="renderView('chat')">💬 CHAT</button>
            <button class="nav-btn" onclick="cerrarSesion()" style="color: var(--fuego); border-color: var(--fuego);">❌ SALIR</button>
        </nav>

    </div>

    <!-- 3. RESTO DE SCRIPTS AL FINAL -->
    <script src="login.js?v=neon_definitivo_4"></script>
    <script src="multimedia.js?v=neon_definitivo_4"></script>
    <script src="chat.js?v=neon_definitivo_4"></script>
    <script src="feeds.js?v=neon_definitivo_4"></script>
    <script src="panic.js?v=neon_definitivo_4"></script>
    <script src="script.js?v=neon_definitivo_4"></script>
    <script src="sw.js"></script>
    
    <!-- Consola Eruda -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</body>
</html>
